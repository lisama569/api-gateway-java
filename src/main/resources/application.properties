# ===== 本地 API 网关配置（均可缺省，下列为默认值）=====

# 配额固定窗口长度（毫秒）
gateway.quota.window-millis=60000

# 上游单次调用超时（毫秒）；幂等请求最大尝试次数（含首次）
gateway.upstream.timeout-millis=300
gateway.upstream.max-attempts=2

# 熔断器：连续失败阈值；OPEN 持续时间（毫秒）后进入 HALF_OPEN 探测；
# HALF_OPEN 恢复期最多同时放行多少个探测请求真正触达上游（其余快速降级）
gateway.circuit.failure-threshold=3
gateway.circuit.open-duration-millis=5000
gateway.circuit.half-open-permits=1

# 在途并发限流：每个维度允许的最大在途请求数；
# scope=caller 表示按调用方计量，scope=caller_resource 表示按「调用方+资源」分别计量。
# 超限请求快速返回 CALLER_OVERLOADED（不排队、不扣配额），请求结束立即释放名额。
gateway.concurrency.max-in-flight=8
gateway.concurrency.scope=caller
