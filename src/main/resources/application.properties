# Local API gateway bootstrap
server.port=8080

# Gateway resilience knobs (mirrored by constants in the resilience package)
gateway.upstream.deadline-millis=150
gateway.circuit.failure-threshold=3
gateway.circuit.open-cooldown-millis=1000
gateway.retry.max-attempts=2
gateway.quota.window-millis=60000

# Explainable per-request decision logs
logging.level.GATEWAY=INFO
